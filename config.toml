# Every analysis parameter lives here. Change it here, not in code, so the run is recorded.
# Parameters marked PRE-SPECIFY must be fixed BEFORE looking at any disease result.

[disease]
name = "Parkinson disease"
efo_trait = "Parkinson disease"        # label sent to the GWAS Catalog API; resolved/verified at fetch time

[gwas]
api_base = "https://www.ebi.ac.uk/gwas/rest/api/v2"
endpoint = "associations"
trait_param = "efo_trait"
# UNVERIFIED v2 pagination details. If `gwas-fetch --inspect` shows something different, fix here.
page_param = "page"
size_param = "size"
first_page = 0
page_size = 200
p_threshold = 5e-8
gene_sources = ["mapped"]              # "mapped" = Catalog-mapped genes. "reported" = author-reported genes (kept in tables, not used by default)

[atlas]
donors = ["9861", "10021", "12876", "14380", "15496", "15697"]
region_depth = 6                       # PRE-SPECIFY: ontology depth for coarse regions. Inspect with `list-regions` BEFORE running the analysis.
min_present_fraction = 0.5             # probe kept if present-call in >= this fraction of pooled samples
min_samples_per_donor_region = 1
min_donors_per_region = 3
min_shared_regions_for_ds = 5

[stats]
n_permutations = 10000
n_bootstrap = 2000
n_level_bins = 20                      # null genes are matched on expression-level bin
seed = 20261002
alpha = 0.05                           # FDR threshold (Benjamini-Hochberg across regions)
alternative = "greater"                # PRE-SPECIFIED hypothesis: enrichment (higher than null)
